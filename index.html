<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // Global error handler to catch cross-origin script / iframe sandbox anomalies
      window.addEventListener('error', function(event) {
        if (!event.error || event.message === 'Script error.' || (event.filename && (event.filename.indexOf('disqus') !== -1 || event.filename.indexOf('disquscdn') !== -1))) {
          // Cross-origin script error with no details suppressed in sandboxed preview
          event.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message === 'Script error.' || String(event.reason).indexOf('clarity') !== -1 || String(event.reason).indexOf('disqus') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
